name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [0.x]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: cli
          key: ${{ matrix.target }}

      - name: Install the musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          HOD_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

      - name: Pack
        shell: bash
        run: |
          set -eu
          name=hod
          if [ "${{ runner.os }}" = "Windows" ]; then name=hod.exe; fi
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/$name" "$staging/$name"
          cp ../LICENSE.md "$staging/LICENSE.md"
          mkdir -p dist
          tar -czf "dist/hod-${{ matrix.target }}.tar.gz" -C "$staging" "$name" LICENSE.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hod-${{ matrix.target }}
          path: cli/dist/hod-${{ matrix.target }}.tar.gz
          retention-days: 1

  publish:
    name: Publish cargo
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Read the version
        id: version
        env:
          SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: |
          set -eu
          crate="$(sed -n 's/^version = "\(.*\)"$/\1/p' cli/Cargo.toml | head -n 1)"
          stamp="$(date -u +%Y%m%d-%H%M%S)"
          echo "tag=edge-$stamp" >> "$GITHUB_OUTPUT"
          echo "version=$crate-edge.$stamp" >> "$GITHUB_OUTPUT"
          printf '%s %s\n' "$crate" "$SHA" > dist/version.txt

      - name: Write the checksums
        working-directory: dist
        run: sha256sum hod-*.tar.gz > checksums.txt

      - name: Write the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          notes="$(printf '%s\n' \
            "The build of \`0.x\`, at commit \`${SHA}\`." \
            "" \
            "\`\`\`" \
            "curl -fsSL https://github.com/hodstack/hodstack/releases/latest/download/install.sh | sh" \
            "\`\`\`" \
            "" \
            "That address gives the newest build. Every push to \`0.x\` writes a release and moves it.")"
          gh release create "$TAG" --title "$TAG" --notes "$notes" --latest --target "$SHA" \
            dist/* install.sh install.ps1

      - name: Delete each release after the tenth
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release list --limit 100 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[].tagName | select(startswith("edge-"))' \
            | tail -n +11 \
            | while read -r old; do gh release delete "$old" --yes --cleanup-tag; done

  npm:
    name: Publish npm
    needs: publish
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: env.NPM_TOKEN != ''
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish
        if: env.NPM_TOKEN != ''
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -eu
          npm version "$VERSION" --no-git-tag-version
          for name in hodstack @hodstack/cli @hodstack/hod; do
            npm pkg set name="$name"
            npm publish --tag edge --access public
          done
          npm pkg set name=hodstack
