[workspace]
resolver = "3"
exclude = [".agents", ".claude"]

[package]
name = "hod"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
description = "Run a Hodstack skill with a coding agent from your terminal."
authors = ["Nuno Maduro <enunomaduro@gmail.com>"]
repository = "https://github.com/hodstack/hodstack"
homepage = "https://github.com/hodstack/hodstack"
license = "MIT"
keywords = ["agent", "skills", "cli", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = [
    "/src/**/*.rs",
    "/templates/*.md",
    "/tests/**",
    "/README.md",
    "/Cargo.toml",
]

[[bin]]
name = "hod"
path = "src/main.rs"

[dependencies]
anstream = "1.0"
anstyle = "1.0"
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"

[dev-dependencies]
snapbox = { version = "1.2", features = ["cmd"] }
tempfile = "3"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
unexpected_cfgs = { level = "deny", check-cfg = [] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"

unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
